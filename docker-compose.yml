name: pkg-cache

services:
  origin:
    build: ./origin
    environment:
      PKG_DIR: /data/packages
    volumes:
      - origin-data:/data/packages
    ports:
      - "8081:8000"   # origin control API: /control/*, /docs

  proxy:
    build: ./proxy
    environment:
      ORIGIN_BASE_URL: http://origin:8000
      CACHE_DIR: /cache
      # Cache capacity limit in bytes (48MiB). Complete packages + in-flight
      # fill reservations + purged packages still read by old clients never
      # exceed this; over-limit downloads get 507 until space is freed.
      CACHE_MAX_BYTES: "50331648"
    volumes:
      - proxy-cache:/cache   # complete packages survive restarts
    ports:
      - "8080:8000"          # download API + /docs purge entry
    depends_on:
      - origin

volumes:
  origin-data:
  proxy-cache:
